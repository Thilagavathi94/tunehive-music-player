<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Signup</title>

<link rel="stylesheet" th:href="@{/css/signup.css}">
<link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>

</head>

<body>

<div class="signup-container">

    <!-- LEFT SIDE -->
    <div class="left">

        <h1>Welcome to Tune Hive</h1>
        <p>Login in or sign up with your mobile number</p>
<form action="/send-otp" method="post">

    <input type="text" name="mobile" placeholder="Enter your mobile number" required>

    <button type="submit" class="continue-btn">Continue</button>

</form>
        <p class="terms">
            Select ‘Continue’ to give consent to Tune Hive Terms of Service and acknowledge Privacy Policy.
        </p>

        <div class="checkbox">
            <input type="checkbox"> I agree to all the Terms and Conditions
        </div>

        <p class="or">Or</p>

        <div class="social">
            <button><i class='bx bxl-google'></i> Google</button>
            <button><i class='bx bxl-facebook'></i> Facebook</button>
        </div>

        <p class="login-text">
            Already have an account? <span>login</span>
        </p>

    </div>

    <!-- RIGHT SIDE -->
    <div class="right">
        <img src="/images/music-banner.png">
    </div>

</div>

</body>
</html>
