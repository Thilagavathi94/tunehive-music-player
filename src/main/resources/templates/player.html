<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:inline="javascript">
<head>
<meta charset="UTF-8">
<title>Music Player</title>

<link rel="stylesheet" th:href="@{/css/player.css}">
</head>

<body>

<!-- NAVBAR -->
<header class="navbar">
    <div class="logo">🎵 TUNE HIVE</div>
    <input type="text" placeholder="Search">
</header>

<div class="layout">

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <h4>BROWSE</h4>
        <p>New Release</p>
        <p>Top Charts</p>
        <p>Top Playlists</p>
        <p>Podcasts</p>

        <h4>LIBRARY</h4>
        <p>History</p>
        <p>Liked Songs</p>
    </aside>

    <!-- PLAYER CONTENT -->
   <main class="content">

    <img id="albumImage" src="/images/majili.jpg" class="album-img">

    <h2 id="songTitle">Majili</h2>
    <p id="artistName">Tanishk Bagchi</p>

    <!-- PROGRESS -->
    <input type="range" id="progress" value="0">

    <!-- CONTROLS -->
    <div class="controls">
        <button onclick="prevSong()">⏮</button>
       <button id="playBtn" onclick="togglePlay()">▶</button>
        <button onclick="nextSong()">⏭</button>
    </div>

    <!-- SONG LIST -->
    <div class="song-list">

        <div class="song-item" onclick="selectSong(0)">🎵 Majili</div>
        <div class="song-item" onclick="selectSong(1)">🎵 Barbad</div>
        <div class="song-item" onclick="selectSong(2)">🎵 Tum Ho</div>
        <div class="song-item" onclick="selectSong(3)">🎵 Dhun</div>

    </div>

</main>
</div>

<audio id="audioPlayer">
    <source src="/songs/majili.mp3">
</audio>

<script>



let songs = [
    {
        title: "Majili",
        artist: "Tanishk Bagchi",
        src: "/songs/majili.mp3",
        img: "/images/majili.jpg"
    },
    {
        title: "Barbad",
        artist: "Faheem Abdullah",
        src: "/songs/song1.mp3",
        img: "/images/movie1.jpg"
    },
    {
        title: "Tum Ho",
        artist: "Arslan Kamil",
        src: "/songs/song2.mp3",
        img: "/images/movie2.jpg"
    },
    {
        title: "Dhun",
        artist: "Various Artists",
        src: "/songs/song3.mp3",
        img: "/images/movie3.jpg"
    }
];

let currentSong = 0;
let playCount = 0;
let isPremium = /*[[${session.premium}]]*/ false;

let audio = document.getElementById("audioPlayer");

// 🔥 load song
function loadSong(index){
    currentSong = index;

    audio.src = songs[index].src;

    document.getElementById("songTitle").innerText = songs[index].title;
    document.getElementById("artistName").innerText = songs[index].artist;
    document.getElementById("albumImage").src = songs[index].img;
}

// ▶ PLAY
let playBtn = document.getElementById("playBtn");

// ▶ / ⏸ toggle
function togglePlay(){

    // 🔥 PREMIUM CHECK
    if(!isPremium){
        if(playCount === 0){
            playCount++;
        } else if(audio.paused){
            alert("Limit reached! Upgrade to premium");
            window.location.href="/plans";
            return;
        }
    }

    if(audio.paused){
        audio.play();
        playBtn.innerText = "⏸";

        // ✅ SAVE HISTORY HERE
        saveToHistory(songs[currentSong]);

    }else{
        audio.pause();
        playBtn.innerText = "▶";
    }
}

// ⏭ NEXT
function nextSong(){
    currentSong = (currentSong + 1) % songs.length;
    loadSong(currentSong);
    audio.play();
    saveToHistory(songs[currentSong]);
}

// ⏮ PREV
function prevSong(){
    currentSong = (currentSong - 1 + songs.length) % songs.length;
    loadSong(currentSong);
    audio.play();
    saveToHistory(songs[currentSong]);
}

// 🎵 CLICK SELECT
function selectSong(index){
    loadSong(index);
    audio.play();
    playBtn.innerText = "⏸";

    // ✅ SAVE
    saveToHistory(songs[index]);
}

// load first song initially
loadSong(0);

function saveToHistory(song){

let history = JSON.parse(localStorage.getItem("history")) || [];

// avoid duplicate (optional)
history = history.filter(item => item.src !== song.src);

// add latest on top
history.unshift(song);

// limit to 10 songs (optional)
if(history.length > 10){
    history.pop();
}

localStorage.setItem("history", JSON.stringify(history));
}
</script>

</body>
</html>
