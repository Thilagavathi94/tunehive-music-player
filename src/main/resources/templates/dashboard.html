<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:inline="javascript">
<head>
<meta charset="UTF-8">
<title>Dashboard</title>
<link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>

<body>

<!-- NAVBAR -->
<header class="navbar">
    <div class="logo">🎵 TUNE HIVE</div>
    <input type="text" placeholder="Search">
    <div class="nav-right">
        <a href="#">Music language ▾</a>
        <a href="/custom-logout">Logout</a>
    </div>
</header>

<div class="layout">

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <h4>BROWSE</h4>
        <p><a href="/dashboard">New Release</a></p>
        <p><a href="/dashboard">Top Charts</a></p>
        <p><a href="/dashboard">Top Playlists</a></p>
        <p><a href="/dashboard">Podcasts</a></p>
        <p><a href="/dashboard">Top Artists</a></p>
        <h4>LIBRARY</h4>
        <p><a href="/history">History</a></p>
        <p><a href="/wishlist">Liked Songs</a></p>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="content">

        <!-- ALBUM -->
        <section class="album-banner">

            <div class="album-info">
                <img src="/images/majili.jpg">
                <h1>MAJILI</h1>
                <p>Various Artists • 7 songs</p>
                <!-- FIX: dashboard play button now goes to /player instead of
                     calling the old playSong() which had its own broken JS counter -->
                <button class="play-btn" onclick="window.location.href='/player'">Play</button>
            </div>

            <div class="album-songs">
                <div class="song-row" onclick="window.location.href='/player'">
                    <span>1</span><span>Majili</span><span>♡</span><span>5:00</span>
                </div>
                <div class="song-row" onclick="window.location.href='/player'">
                    <span>2</span><span>Barbad</span><span>♡</span><span>5:00</span>
                </div>
                <div class="song-row" onclick="window.location.href='/player'">
                    <span>3</span><span>Tum Ho</span><span>♡</span><span>5:00</span>
                </div>
                <div class="song-row" onclick="window.location.href='/player'">
                    <span>4</span><span>Dhun</span><span>♡</span><span>5:00</span>
                </div>
            </div>
        </section>

        <!-- ROW -->
        <h3>You Might Like</h3>
        <div class="row">
            <img src="/images/movie1.jpg">
            <img src="/images/movie2.jpg">
            <img src="/images/movie3.jpg">
            <img src="/images/movie4.jpg">
            <img src="/images/movie5.jpg">
        </div>

    </main>
</div>

<!-- PLAYER BAR -->
<div class="player">
    <button onclick="window.location.href='/player'">▶ Play</button>
</div>

</body>
</html>
