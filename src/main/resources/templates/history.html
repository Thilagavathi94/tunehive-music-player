<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>History - Tune Hive</title>

<link rel="stylesheet" th:href="@{/css/style.css}">

<style>

body{
margin:0;
font-family:Arial;
background:url('/images/music-bg.jpg') center/cover no-repeat;
color:white;
}

/* LAYOUT */
.layout{
display:flex;
}

/* SIDEBAR */
.sidebar{
width:220px;
background:rgba(0,0,0,0.9);
height:100vh;
padding:20px;
position:fixed;
top:60px;
}

.sidebar ul{
list-style:none;
padding:0;
}

.sidebar li{
padding:12px;
cursor:pointer;
}

.sidebar li:hover,
.sidebar li.active{
background:#e91e63;
border-radius:8px;
}

/* CONTENT */
.content{
margin-left:240px;
padding:20px;
}

/* HISTORY GRID */
.row{
display:flex;
gap:20px;
flex-wrap:wrap;
}

.card{
width:180px;
background:rgba(0,0,0,0.6);
padding:10px;
border-radius:10px;
text-align:center;
transition:0.3s;
}

.card:hover{
transform:scale(1.05);
}

.card img{
width:100%;
border-radius:10px;
}

.card h4{
margin:10px 0;
}

/* BUTTONS */
.card-actions{
display:flex;
justify-content:center;
gap:10px;
}

.card-actions button{
padding:6px 10px;
border:none;
border-radius:50%;
cursor:pointer;
background:#e91e63;
color:white;
}

</style>
</head>

<body>

<!-- NAVBAR -->
<header class="navbar">
<div class="logo">🎧 TUNE HIVE</div>

<nav class="menu">
<a href="/player">Music</a>
<a href="/podcasts">Podcasts</a>
<a href="/plans">Pro</a>
</nav>

<div class="search">
<input type="text" placeholder="Search">
</div>

<div class="nav-right">
<a href="/account">My Profile</a>
<a href="/logout">Logout</a>
</div>
</header>

<div class="layout">

<!-- SIDEBAR -->
<aside class="sidebar">

<h4>BROWSE</h4>
<ul>
<li onclick="location.href='/'">Home</li>
<li onclick="location.href='/player'">Music</li>
<li onclick="location.href='/podcasts'">Podcasts</li>
<li onclick="location.href='/plans'">Pro</li>
</ul>

<h4>LIBRARY</h4>
<ul>
<li class="active">History</li>
<li onclick="location.href='/wishlist'">Liked Songs</li>
<li>Albums</li>
<li>Artists</li>
</ul>

</aside>

<!-- CONTENT -->
<main class="content">

<h2>🕒 Recently Played</h2>

<div class="row">

<div class="card">
<img src="/images/movie1.jpg">
<h4>Majili</h4>
<div class="card-actions">
<button onclick="playSong()">▶</button>
<button onclick="addWishlist(this)">❤️</button>
</div>
</div>

<div class="card">
<img src="/images/movie2.jpg">
<h4>Barbad</h4>
<div class="card-actions">
<button onclick="playSong()">▶</button>
<button onclick="addWishlist(this)">❤️</button>
</div>
</div>

<div class="card">
<img src="/images/movie3.jpg">
<h4>Tum Ho Tum</h4>
<div class="card-actions">
<button onclick="playSong()">▶</button>
<button onclick="addWishlist(this)">❤️</button>
</div>
</div>

<div class="card">
<img src="/images/movie4.jpg">
<h4>Hali</h4>
<div class="card-actions">
<button onclick="playSong()">▶</button>
<button onclick="addWishlist(this)">❤️</button>
</div>
</div>

</div>

</main>

</div>

<script>

// play
function playSong(){
alert("Playing from history 🎵");
}

// wishlist
function addWishlist(btn){

if(btn.classList.contains("active")){
btn.classList.remove("active");
btn.innerText="❤️";
}else{
btn.classList.add("active");
btn.innerText="💚";
}

}

</script>

</body>
</html>
