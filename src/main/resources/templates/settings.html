<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

<meta charset="UTF-8">
<title>Settings</title>

<link rel="stylesheet" th:href="@{/css/style.css}">

<style>

.settings-box{
max-width:500px;
margin:auto;
background:#222;
padding:30px;
border-radius:15px;
}

.settings-box h2{
text-align:center;
margin-bottom:20px;
}

.settings-box input{
width:100%;
padding:10px;
margin:10px 0;
border-radius:10px;
border:none;
}

.settings-box button{
width:100%;
padding:12px;
background:#ff2e63;
border:none;
color:white;
border-radius:20px;
margin-top:10px;
cursor:pointer;
}

.logout{
background:red;
}

</style>

</head>

<body>

<header class="navbar">
<div class="logo">🎧 TUNE HIVE</div>
</header>

<div class="layout">

<aside class="sidebar">
<ul class="sidebar-menu">
<li onclick="location.href='/'">Home</li>
<li onclick="location.href='/account'">Account</li>
<li onclick="location.href='/settings'" class="active">Settings</li>
</ul>
</aside>

<main class="content">

<div class="settings-box">

<h2>⚙️ Settings</h2>

<form action="" method="post">

<input type="text" name="mobile" placeholder="Update Mobile">

<form action="" method="post">
    <input type="text" name="mobile" required>
    <button type="submit">Update</button>
</form>
</form>

<button class="logout" onclick="logout()">Logout</button>

</div>

</main>

</div>

<script>

function logout(){
    window.location.href="/logout";
}

</script>

</body>
</html>
